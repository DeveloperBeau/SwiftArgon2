name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: "6.4.3"
  ANDROID_SDK_URL: https://download.swift.org/swift-6.4.3-release/android-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_android.artifactbundle.tar.gz
  ANDROID_SDK_CHECKSUM: a78839edf4ec161e03b9f1e22a0ef94e565ece3f3ce5c03e3c79246c6b71f0a9
  ANDROID_SDK_ID: swift-6.4.3-RELEASE_android
  ANDROID_NDK_VERSION: r30

jobs:
  macos:
    name: macOS tests (Xcode 26.6)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6" # newest on GitHub-hosted runners; also tested locally on 27.2
      - run: swift --version
      - run: swift test

  ios:
    name: iOS Simulator tests (Xcode 26.6)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6" # newest on GitHub-hosted runners; also tested locally on 27.2
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          xcodebuild test \
            -scheme SwiftArgon2-Package \
            -destination "id=$SIM_UDID"

  android:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 runs the full test suite on an emulator (KVM-accelerated).
          - arch: x86_64
            run-tests: true
          # GitHub's x86_64 runners cannot emulate arm64 at usable speed,
          # so aarch64 is build-only here.
          - arch: aarch64
            run-tests: false
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftly and Swift ${{ env.SWIFT_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils-gold libcurl4-openssl-dev
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install "$SWIFT_VERSION" --use --assume-yes
          echo "$(dirname "$(command -v swift)")" >> "$GITHUB_PATH"
          swift --version

      - name: Install Swift SDK for Android
        run: swift sdk install "$ANDROID_SDK_URL" --checksum "$ANDROID_SDK_CHECKSUM"

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-$(uname -s).zip"
          unzip -qo ndk.zip -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Link NDK into Swift SDK
        run: |
          script=$(find "$HOME" -maxdepth 7 -path "*/${ANDROID_SDK_ID}.artifactbundle/swift-android/scripts/setup-android-sdk.sh" -print -quit 2>/dev/null || true)
          echo "setup script: ${script:-<not found>}"
          test -n "$script"
          "$script"

      - name: Build library (static Swift stdlib)
        run: |
          swift build --product SwiftArgon2 \
            --swift-sdk "$ANDROID_SDK_ID" \
            --triple "${{ matrix.arch }}-unknown-linux-android23" \
            --static-swift-stdlib

      # Swift Testing ships only as a shared library in the Android SDK,
      # so tests build against the dynamic stdlib.
      - name: Build tests
        run: |
          swift build --build-tests \
            --swift-sdk "$ANDROID_SDK_ID" \
            --triple "${{ matrix.arch }}-unknown-linux-android23"

      - name: Enable KVM
        if: matrix.run-tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        if: matrix.run-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: scripts/android-test.sh x86_64
